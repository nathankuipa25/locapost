name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest

    # These only need to satisfy code that reads them while building
    # (Prisma's schema needs a resolvable DATABASE_URL, NextAuth reads
    # its provider env vars) — no real database or OAuth calls happen
    # during a build. Add real values as repository secrets (Settings
    # > Secrets and variables > Actions) to build against production
    # config; otherwise these placeholders keep CI green.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci' }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-only-placeholder-not-for-prod' }}
      GITHUB_ID: ${{ secrets.OAUTH_GITHUB_ID || 'ci-placeholder' }}
      GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_SECRET || 'ci-placeholder' }}
      GOOGLE_ID: ${{ secrets.OAUTH_GOOGLE_ID || 'ci-placeholder' }}
      GOOGLE_SECRET: ${{ secrets.OAUTH_GOOGLE_SECRET || 'ci-placeholder' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
